<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Emerald++ on your home screen. English or German names. Menus stay English.">
    <meta name="theme-color" content="#07140c">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/icons/icon-192.png">
    <title>Emerald</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="game" hidden></div>
    <div id="chrome" hidden>
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div id="menu" hidden>
        <span id="status">On this phone</span>
        <button id="phrase" type="button">Save phrase</button>
        <div id="speeds" role="group" aria-label="Speed">
          <button type="button" data-rate="1.5" aria-pressed="false">1.5x</button>
          <button type="button" data-rate="2" aria-pressed="false">2x</button>
          <button type="button" data-rate="3" aria-pressed="false">3x</button>
        </div>
        <label id="pad-height">Button height
          <input id="pad-range" type="range" min="20" max="220" value="150">
          <span id="pad-readout">150</span>
        </label>
        <label id="screen-size">Horizontal size
          <input id="screen-range" type="range" min="70" max="100" value="92">
          <span id="screen-readout">92%</span>
        </label>
        <button id="export" type="button">Save file</button>
        <button id="names" type="button">Names</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
